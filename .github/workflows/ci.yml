name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # The Ubuntu package mirror that `playwright install --with-deps` downloads
    # from occasionally stalls. Without a cap, a stalled job runs until GitHub's
    # six-hour default timeout. The cap is set well above a normal run so that a
    # slow-but-working mirror (around 10 minutes) still passes.
    timeout-minutes: 15
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7.0.1
      - name: Setup Node env 🏗
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci
      - name: Install test browser 🌐
        run: npx playwright install --with-deps chromium
      - name: Run build 🔨
        run: npm run build
      - name: Run document 📖
        run: npm run document
      - name: Check manifests are up to date 📋
        run: git diff --exit-code manifests
      - name: Run tests ✅
        run: npm test
