name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # The job normally finishes in about a minute. Without a cap, a hung job,
    # such as a stalled download, runs until GitHub's six-hour default timeout.
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7.0.1
      - name: Setup Node env 🏗
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci
      # No `--with-deps`: the ubuntu-latest image ships Google Chrome, so
      # Chromium's system libraries are already installed. The flag only adds
      # fonts from Ubuntu's package mirror, which sometimes stalls for minutes.
      - name: Install test browser 🌐
        run: npx playwright install chromium
      - name: Run build 🔨
        run: npm run build
      - name: Run document 📖
        run: npm run document
      - name: Check manifests are up to date 📋
        run: git diff --exit-code manifests
      - name: Run tests ✅
        run: npm test
